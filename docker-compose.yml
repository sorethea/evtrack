version: '3.7'
services:

    #PHP Service
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: evtrack-app   # <-- custom image name (no 'ev_app')
        container_name: app
        restart: unless-stopped
        environment:
            SERVICE_NAME: app
            SERVICE_TAGS: dev
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - app-network

    #Nginx Service
    web:
        image: nginx:alpine
        container_name: web
        restart: unless-stopped
        tty: true
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www
            - ./nginx/conf.d/:/etc/nginx/conf.d
            - ./nginx/ssl:/etc/nginx/ssl
        networks:
            - app-network

    #Worker Service
    worker:
        image: evtrack-app   # <-- use the same image built for app
        container_name: worker
        restart: always
        command: php artisan solar:listen
        working_dir: /var/www
        volumes:
            - ./vendor:/var/www/vendor   # mount vendor (or add to image)
        environment:
            - SOLAR_DEVICE_IP=${SOLAR_DEVICE_IP}
            - SOLAR_PASSWORD=${SOLAR_PASSWORD}
            - DB_CONNECTION=${DB_CONNECTION}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        networks:
            - app-network
        depends_on:
            - app

networks:
    app-network:
        driver: bridge
