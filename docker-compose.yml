version: '3.7'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: evtrack-app
        container_name: app
        restart: unless-stopped
        environment:
            - TZ=Asia/Phnom_Penh
            - SERVICE_NAME=app
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - app-network

    web:
        image: nginx:alpine
        container_name: web
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www
            - ./nginx/conf.d/:/etc/nginx/conf.d
            - ./nginx/ssl:/etc/nginx/ssl
        networks:
            - app-network

    worker:
        user: www   # <-- must be present
        image: evtrack-app
        container_name: worker
        restart: always
        command: php artisan solar:listen
        working_dir: /var/www
        volumes:
            - ./:/var/www
        environment:
            - SOLAR_DEVICE_IP=${SOLAR_DEVICE_IP}
            - SOLAR_PASSWORD=${SOLAR_PASSWORD}
            - DB_CONNECTION=${DB_CONNECTION}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        networks:
            - app-network
        depends_on:
            - app

networks:
    app-network:
        driver: bridge
