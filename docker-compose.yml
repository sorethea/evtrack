#    tty: true
#    ports:
#      - "3306:3306"
#    environment:
#      MYSQL_DATABASE: ${DB_DATABASE}
#      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
#      SERVICE_TAGS: dev
#      SERVICE_NAME: mysql
#    volumes:
#      - ./mysql/:/var/lib/pos
#      - ./mysql/my.cnf:/etc/mysql/my.cnf
#    networks:
#      - app-network
  worker:
      build:
          context: .
          dockerfile: Dockerfile
      container_name: worker
      restart: always
      command: php artisan solar:listen
      working_dir: /var/www
      volumes:
          - ./storage/logs:/var/www/storage/logs   # optional, for log persistence
      environment:
          - SOLAR_DEVICE_IP=${SOLAR_DEVICE_IP}
          - SOLAR_PASSWORD=${SOLAR_PASSWORD}
          - DB_CONNECTION=${DB_CONNECTION}
          - DB_HOST=${DB_HOST}
          - DB_PORT=${DB_PORT}
          - DB_DATABASE=${DB_DATABASE}
          - DB_USERNAME=${DB_USERNAME}
          - DB_PASSWORD=${DB_PASSWORD}
      networks:
          - app-network
      depends_on:
          - app
#Docker Networks
networks:
  app-network:
    driver: bridge
#Volumes
volumes:
  dbdata:
    driver: local
