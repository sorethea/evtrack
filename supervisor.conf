[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:solar-assistant]
command=php /var/www/artisan solar:listen
directory=/var/www
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/solar-assistant.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
user=www
